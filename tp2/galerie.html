<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galerie d'images</title>
</head>

<body>
    <h1>Ma galerie d'images</h1>
    <!-- Image 1 : paysage avec dimensions -->
    <h2>Un paysage</h2>
    <img src="images/paysage.jpeg" alt="Vue panoramique d'un paysage tropical au coucher du soleil" width="600"
        title="Paysage tropical" />
    <p>Photo de paysage — largeur fixée à 600 px.</p>
    <!-- Image 2 : logo PNG transparent -->
    <h2>Un logo PNG</h2>
    <img src="images/logoD.png" alt="Logo de l'application web" width="250" height="250" />
    <p>Logo PNG avec fond transparent.</p>
    <!-- Image 3 : portrait en tant que lien -->
    <h2>Portrait cliquable</h2>
    <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">
        <img src="images/portrait.jpeg" alt="Portrait — cliquez pour aller sur Google" width="400" height="400" />
    </a>
    <p>Cliquez sur la photo pour accéder à Google.</p>
    <!-- Image 4 : lien brisé intentionnel (tester alt) -->
    <h2>Image manquante (test alt)</h2>
    <img src="images/inexistante.jpg" alt="Cette image n'existe pas — le texte alt s'aiche à sa place" width="300" />
</body>

</html>
